<link rel="stylesheet" href="stylesheets/overview.css">

<div id="surveyContainer"></div>

<img src="img/loadingCircle.png" id="loadingCircle">

<div id="fileSelector">
    <button id="fileButton" onclick="document.getElementById('fileInput').click()" disabled>📑 Datei wählen</button>
    <input type="file" id="fileInput" accept=".json" onchange="onFileSelect()">
    <p id="fileLabel">Wähle eine Datei aus</p>
</div>


<template id="surveyTemplate">
    <div class="survey">
        <div>
            <h3>Titel</h3>
            <p>Datum</p>
        </div>
        <p>Max auswahlen</p>
        <div>
            <ul>Fragen</ul>
            <canvas class="pieChart" style="height: 300px; flex-grow: 1; max-width: 45%;"></canvas>
        </div>
    </div>
</template>
